<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191F2B"/>
      <stop offset="50%" stop-color="#11141B"/>
      <stop offset="100%" stop-color="#090B0F"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="beamGlow" x="-20%" y="-20%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="lampFlare" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Headlamp Volumetric Cone Gradient -->
    <linearGradient id="volumetricBeam" x1="0%" y1="50%" x2="100%" y2="10%">
      <stop offset="0%" stop-color="#FFE885" stop-opacity="0.95"/>
      <stop offset="20%" stop-color="#F59E0B" stop-opacity="0.80"/>
      <stop offset="55%" stop-color="#D97706" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#92400E" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Radial Lamp Bulb Glow -->
    <radialGradient id="lampBulb" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="30%" stop-color="#FFFBEB"/>
      <stop offset="65%" stop-color="#FBBF24"/>
      <stop offset="88%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </radialGradient>

    <!-- Golden Helmet Shell Gradient -->
    <linearGradient id="helmetMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="25%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>

    <!-- Helmet Top Gloss / Highlight -->
    <linearGradient id="helmetGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#FCD34D" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Helmet Brim Chrome Reflection -->
    <linearGradient id="brimChrome" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="30%" stop-color="#FEF3C7"/>
      <stop offset="55%" stop-color="#F59E0B"/>
      <stop offset="85%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Shield Left Wing (Vibrant Electric Cyan) -->
    <linearGradient id="shieldCyanWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="40%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Shield Right Wing (Deep Azure / Cobalt Blue) -->
    <linearGradient id="shieldBlueWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="60%" stop-color="#0369A1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>

    <!-- Shield Dark Core Fill -->
    <linearGradient id="shieldDarkCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161B26"/>
      <stop offset="60%" stop-color="#0F131A"/>
      <stop offset="100%" stop-color="#090B10"/>
    </linearGradient>

    <!-- 3D Strata Light Facet -->
    <linearGradient id="strataLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <!-- 3D Strata Dark Facet -->
    <linearGradient id="strataDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" stroke="#262D3D" stroke-width="3"/>
  <rect x="18" y="18" width="476" height="476" rx="106" ry="106" fill="none" stroke="#384259" stroke-width="1.5" opacity="0.6"/>

  <!-- ==================== 1. HEADLAMP VOLUMETRIC SPOTLIGHT BEAM ==================== -->
  <path d="M305 142 L508 85 L485 220 Z" fill="url(#volumetricBeam)" filter="url(#beamGlow)" />

  <!-- ==================== 2. THE ANGULAR PROTECTION SHIELD ==================== -->
  <!-- Outer Shield Shadow -->
  <path d="M102 210 L410 210 L410 345 L256 465 L102 345 Z" fill="#05070A" opacity="0.5" filter="url(#beamGlow)"/>

  <!-- Shield Dark Interior Core -->
  <path d="M102 210 L410 210 L410 345 L256 465 L102 345 Z" fill="url(#shieldDarkCore)"/>

  <!-- Shield Left Cyan Wing Border -->
  <path d="M102 210 L256 210 L256 465 L102 345 Z" 
        stroke="url(#shieldCyanWing)" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Shield Right Blue Wing Border -->
  <path d="M256 210 L410 210 L410 345 L256 465 Z" 
        stroke="url(#shieldBlueWing)" stroke-width="26" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Shield Bottom Bevel Highlight (Cyan Peak) -->
  <path d="M256 440 L256 465 L220 438 Z" fill="#38BDF8"/>
  <path d="M256 440 L256 465 L292 438 Z" fill="#0284C7"/>

  <!-- ==================== 3. 3D FACETED GEOLOGICAL STRATA ==================== -->
  <!-- Bottom Strata Left / Right Facets -->
  <path d="M185 395 L256 345 L256 445 L185 395 Z" fill="url(#strataLight)"/>
  <path d="M256 345 L327 395 L256 445 Z" fill="url(#strataDark)"/>

  <!-- Mid Strata Left / Right Facets -->
  <path d="M208 360 L256 322 L256 405 L208 360 Z" fill="#94A3B8"/>
  <path d="M256 322 L304 360 L256 405 Z" fill="#475569"/>

  <!-- Top Strata Ridge Line -->
  <path d="M208 360 L256 322 L304 360" stroke="#CBD5E1" stroke-width="2.5" fill="none"/>

  <!-- ==================== 4. BOLD WHITE 'M' MONOGRAM ==================== -->
  <!-- 'M' Subtle Drop Shadow -->
  <path d="M152 338 L152 222 L206 222 L256 288 L306 222 L360 222 L360 338 L318 338 L318 266 L256 346 L194 266 L194 338 Z" 
        fill="#05070B" opacity="0.55" transform="translate(0, 5)"/>

  <!-- 'M' Crisp White Monogram -->
  <path d="M152 338 L152 222 L206 222 L256 288 L306 222 L360 222 L360 338 L318 338 L318 266 L256 346 L194 266 L194 338 Z" 
        fill="#FFFFFF"/>

  <!-- ==================== 5. MINING HELMET / HARDHAT (ISOMETRIC) ==================== -->
  <!-- Helmet Rear Neck/Ear Guard (Left Silhouette) -->
  <path d="M100 205 C92 188 98 165 116 150 C125 142 142 135 152 132 L150 195 Z" fill="#B45309"/>
  <path d="M102 205 L135 178 L148 198 Z" fill="#78350F"/>

  <!-- Helmet Main Dome Structure -->
  <path d="M118 206 C112 145 155 78 256 78 C357 78 398 145 394 206 Z" fill="url(#helmetMain)"/>

  <!-- Helmet Top Gloss Dome Reflection -->
  <path d="M136 195 C132 148 168 94 256 94 C344 94 378 148 374 195 Z" fill="url(#helmetGloss)"/>

  <!-- Helmet Contour Shadow Crest (Crease Line) -->
  <path d="M118 195 Q256 145 394 195 L396 206 Q256 156 116 206 Z" fill="#78350F" opacity="0.85"/>

  <!-- Helmet Chrome / Gold Front Brim Strip -->
  <path d="M106 208 L404 208 L392 195 L118 195 Z" fill="url(#brimChrome)" stroke="#78350F" stroke-width="1.5"/>

  <!-- Ultra-Bright Brim Specular Highlight -->
  <path d="M185 204 L375 204 L365 200 L195 200 Z" fill="#FFFFFF" opacity="0.9"/>

  <!-- ==================== 6. ILLUMINATED HEADLAMP ==================== -->
  <!-- Lamp Outer Bezel / Housing -->
  <ellipse cx="296" cy="144" rx="38" ry="38" fill="#0F172A" stroke="#475569" stroke-width="4"/>
  <ellipse cx="296" cy="144" rx="33" ry="33" fill="#1E293B" />

  <!-- Lamp Inner Golden Reflector Bowl -->
  <circle cx="296" cy="144" r="28" fill="url(#lampBulb)" />

  <!-- White Radiant Center Bulb & Flare -->
  <circle cx="296" cy="144" r="18" fill="#FFFFFF" filter="url(#lampFlare)" />
  <circle cx="296" cy="144" r="10" fill="#FFFBEB" />
</svg>
